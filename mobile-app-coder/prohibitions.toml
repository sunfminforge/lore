# What mobile-app-coder must not do. Each says which kind it guards: `money`
# (Felix's), `credentials`, `irreversible`, `data-leaving-host` or
# `product-direction` (the steward's), or `none` (the warden's). The
# trainer's guarded prohibitions are its floor, unchanged (guild ADR 0002).


[[prohibition]]
id = "no-force-push"
guards = "irreversible"
on = "shell"
match = "git push --force*"
reason = "A force push rewrites history others have."

[[prohibition]]
id = "no-repo-delete"
guards = "irreversible"
on = "shell"
match = "* repos delete *"
reason = "A deleted repo cannot be had back."

[[prohibition]]
id = "no-keychain-read"
guards = "credentials"
on = "shell"
match = "security find-*-password*"
reason = "Credentials are the steward's to hand out."

[[prohibition]]
id = "no-checkout"
guards = "money"
on = "fetch"
match = "https://*checkout*"
reason = "Spending money is Felix's alone."

[[prohibition]]
id = "no-paste-out"
guards = "data-leaving-host"
on = "fetch"
match = "https://*paste*"
reason = "Private data stays on Guild's machines."

[[prohibition]]
id = "no-gh-file"
guards = "data-leaving-host"
on = "shell"
match = "*gh issue create*"
reason = "What goes to GitHub is filed by the steward's filer alone: a cause in Guild's code with guild ticket file, which labels it for the guild fleet, files it once per cause and follows it; Guild's own issues are read and commented on with guild task and guild goal, never gh."

[[prohibition]]
id = "no-push-base"
guards = "none"
on = "shell"
match = "git push * HEAD:main*"
reason = "Work reaches the base branch only by a pull request the warden lands."

[[prohibition]]
id = "no-push-main"
guards = "none"
on = "shell"
match = "git push * main*"
reason = "Work reaches the base branch only by a pull request the warden lands."

[[prohibition]]
id = "no-review"
guards = "none"
on = "shell"
match = "guild task review *"
reason = "The warden accepts or sends back work; this role never reviews its own."

[[prohibition]]
id = "no-approve"
guards = "none"
on = "shell"
match = "guild pull approve *"
reason = "Approving a pull request is the warden's; this role hands its work in."

[[prohibition]]
id = "no-land"
guards = "none"
on = "shell"
match = "guild land *"
reason = "Landing is the code's, on the warden's approval; this role never lands."

[[prohibition]]
id = "no-role-draft"
guards = "none"
on = "shell"
match = "guild role *"
reason = "Only the trainer crew drafts, defines or restores roles."

[[prohibition]]
id = "no-goal-lever"
guards = "none"
on = "shell"
match = "guild goal *"
reason = "Goals and their levers are the foreman's; this role asks it with guild task question."

[[prohibition]]
id = "no-hard-stop"
guards = "none"
on = "shell"
match = "guild stop --hard*"
reason = "Hard-stopping an instance is the warden's or a person's."

[[prohibition]]
id = "no-decide"
guards = "product-direction"
on = "shell"
match = "guild task decide *"
reason = "A decision ticket is Felix's to decide; this role asks with guild task ask."

[[prohibition]]
id = "no-app-upload"
guards = "irreversible"
on = "shell"
match = "xcrun altool *"
reason = "A build uploaded to App Store Connect cannot be taken back; this role never submits an app."

[[prohibition]]
id = "no-transporter"
guards = "irreversible"
on = "shell"
match = "xcrun iTMSTransporter *"
reason = "A build uploaded to App Store Connect cannot be taken back; this role never submits an app."

[[prohibition]]
id = "no-identity-import"
guards = "credentials"
on = "shell"
match = "security import *"
reason = "Signing identities are the steward's to hand out; simulator builds need none."

[[prohibition]]
id = "no-identity-read"
guards = "credentials"
on = "shell"
match = "security find-identity*"
reason = "Signing identities are the steward's to hand out; simulator builds need none."

[[prohibition]]
id = "no-archive"
guards = "none"
on = "shell"
match = "xcodebuild *archive*"
reason = "Archiving and exporting are the start of a release, and this role never releases; it builds and tests for the simulator."

[[prohibition]]
id = "no-device-install"
guards = "none"
on = "shell"
match = "xcrun devicectl *"
reason = "This role signs for no device and installs on none; its apps run in the simulator."

[[prohibition]]
id = "no-simulator-delete"
guards = "none"
on = "shell"
match = "xcrun simctl delete *"
reason = "The machine's simulators are shared with other instances; a run boots and erases only the device it made or names."

[[prohibition]]
id = "no-install"
guards = "none"
on = "shell"
match = "brew install *"
reason = "This role installs nothing; a missing Xcode, runtime or tool is a question to the foreman."

[[prohibition]]
id = "no-release"
guards = "none"
on = "shell"
match = "git tag *"
reason = "Releasing is not this role's; a change ready to ship says so in its pull request."

[[prohibition]]
id = "no-fastlane"
guards = "irreversible"
on = "shell"
match = "fastlane *"
reason = "Fastlane signs, uploads and submits to the stores, which cannot be taken back; this role builds for the simulator and emulator and never submits an app."

[[prohibition]]
id = "no-keystore"
guards = "credentials"
on = "shell"
match = "keytool *"
reason = "Signing keys are the steward's to hand out; an emulator build is the debug variant, signed with the SDK's own debug key."

[[prohibition]]
id = "no-release-bundle"
guards = "none"
on = "shell"
match = "*bundleRelease*"
reason = "A release bundle is the start of a release, and this role never releases; it builds the debug variant for the emulator."

[[prohibition]]
id = "no-flutter-release"
guards = "none"
on = "shell"
match = "flutter build ipa*"
reason = "An ipa is built for a device or a store, and this role signs for none; it builds for the simulator."

[[prohibition]]
id = "no-flutter-appbundle"
guards = "none"
on = "shell"
match = "flutter build appbundle*"
reason = "An app bundle is built for the store, and this role never releases; it builds the debug variant for the emulator."

[[prohibition]]
id = "no-adb-device"
guards = "none"
on = "shell"
match = "adb -d *"
reason = "This role installs on no physical device; its apps run in the emulator."

[[prohibition]]
id = "no-avd-delete"
guards = "none"
on = "shell"
match = "avdmanager delete *"
reason = "The machine's emulators are shared with other instances; a run starts and wipes only the AVD it made or names."

[[prohibition]]
id = "no-sdkmanager"
guards = "none"
on = "shell"
match = "sdkmanager *"
reason = "The Android SDK is the machine's and comes as Guild gets tools; a missing platform or system image is a question to the foreman."

[[prohibition]]
id = "no-flutter-upgrade"
guards = "none"
on = "shell"
match = "flutter upgrade*"
reason = "The Flutter SDK is the machine's and comes as Guild gets tools; the project's pinned version is a question to the foreman."

[[prohibition]]
id = "no-gem-install"
guards = "none"
on = "shell"
match = "gem install *"
reason = "This role installs nothing on the machine; a missing tool is a question to the foreman."
