# What ui-tester must not do. Each says which kind it guards: `money`
# (Felix's), `credentials`, `irreversible`, `data-leaving-host` or
# `product-direction` (the steward's), or `none` (the warden's). The
# trainer's guarded prohibitions are its floor, unchanged (guild ADR 0002).

[[prohibition]]
id = "no-force-push"
guards = "irreversible"
on = "shell"
match = "git push --force*"
reason = "A force push rewrites history others have."

[[prohibition]]
id = "no-repo-delete"
guards = "irreversible"
on = "shell"
match = "* repos delete *"
reason = "A deleted repo cannot be had back."

[[prohibition]]
id = "no-keychain-read"
guards = "credentials"
on = "shell"
match = "security find-*-password*"
reason = "Credentials are the steward's to hand out."

[[prohibition]]
id = "no-checkout"
guards = "money"
on = "fetch"
match = "https://*checkout*"
reason = "Spending money is Felix's alone."

[[prohibition]]
id = "no-paste-out"
guards = "data-leaving-host"
on = "fetch"
match = "https://*paste*"
reason = "Private data stays on Guild's machines."

[[prohibition]]
id = "no-npm-publish"
guards = "irreversible"
on = "shell"
match = "npm publish*"
reason = "A package published to a registry cannot be taken back; this role walks a UI, it ships nothing."

[[prohibition]]
id = "no-token-handling"
guards = "credentials"
on = "shell"
match = "guild * token *"
reason = "Tokens are the steward's to hand out, never this role's to fetch."

[[prohibition]]
id = "no-sudo"
guards = "irreversible"
on = "shell"
match = "sudo *"
reason = "Nothing is installed or changed outside the worktree."

[[prohibition]]
id = "no-global-install"
guards = "irreversible"
on = "shell"
match = "npm install -g*"
reason = "Nothing is installed outside the worktree."

[[prohibition]]
id = "no-brew-install"
guards = "irreversible"
on = "shell"
match = "brew install*"
reason = "Nothing is installed outside the worktree; missing tooling is a question to the foreman."

[[prohibition]]
id = "no-tunnel"
guards = "data-leaving-host"
on = "shell"
match = "*ngrok*"
reason = "The UI is served on 127.0.0.1 only; a public tunnel exposes the repo's work."

[[prohibition]]
id = "no-code-ts"
guards = "none"
on = "write"
match = "*.ts"
reason = "This role never changes the code it walks; it writes only evidence."

[[prohibition]]
id = "no-code-tsx"
guards = "none"
on = "write"
match = "*.tsx"
reason = "This role never changes the code it walks; it writes only evidence."

[[prohibition]]
id = "no-code-js"
guards = "none"
