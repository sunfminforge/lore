[[prohibition]]
id = "no-package-json"
guards = "none"
on = "write"
match = "*package.json"
reason = "This role never changes the code it walks, its manifest least of all."

[[prohibition]]
id = "no-lockfile-npm"
guards = "none"
on = "write"
match = "*package-lock.json"
reason = "Dependencies install the lockfile's way; the lockfile is never changed."

[[prohibition]]
id = "no-lockfile-yarn"
guards = "none"
on = "write"
match = "*yarn.lock"
reason = "Dependencies install the lockfile's way; the lockfile is never changed."

[[prohibition]]
id = "no-lockfile-pnpm"
guards = "none"
on = "write"
match = "*pnpm-lock.yaml"
reason = "Dependencies install the lockfile's way; the lockfile is never changed."

[[prohibition]]
id = "no-lockfile-cargo"
guards = "none"
on = "write"
match = "*Cargo.lock"
reason = "Dependencies install the lockfile's way; the lockfile is never changed."

[[prohibition]]
id = "no-push-base"
guards = "none"
on = "shell"
match = "git push * HEAD:main*"
reason = "Work reaches the base branch only by a pull request the warden lands."

[[prohibition]]
id = "no-push-main"
guards = "none"
on = "shell"
match = "git push * main*"
reason = "Work reaches the base branch only by a pull request the warden lands."

[[prohibition]]
id = "no-review"
guards = "none"
on = "shell"
match = "guild task review *"
reason = "The warden accepts or sends back work; this role judges nothing."

[[prohibition]]
id = "no-approve"
guards = "none"
on = "shell"
match = "guild pull approve *"
reason = "Approving a pull request is the warden's."

[[prohibition]]
id = "no-land"
guards = "none"
on = "shell"
match = "guild land *"
reason = "Landing is the code's, on the warden's approval; this role never lands."

[[prohibition]]
id = "no-role-draft"
guards = "none"
on = "shell"
match = "guild role *"
reason = "Only the trainer crew drafts, defines or restores roles."

[[prohibition]]
id = "no-goal-lever"
guards = "none"
on = "shell"
match = "guild goal *"
reason = "Goals and their levers are the foreman's; this role asks it with guild task question."

[[prohibition]]
id = "no-hard-stop"
guards = "none"
on = "shell"
match = "guild stop --hard*"
reason = "Hard-stopping an instance is the warden's or a person's."

[[prohibition]]
id = "no-decide"
guards = "product-direction"
on = "shell"
match = "guild task decide *"
reason = "A decision ticket is Felix's to decide; this role asks with guild task ask."
