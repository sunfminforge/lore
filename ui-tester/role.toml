# ui-tester: builds or serves a repo's web UI, walks it in a real browser
# at desktop and phone width in light and dark, and records each step as
# evidence. It changes no code and judges nothing. Drafted by the trainer
# for guild/tasks#54; changes land on the warden's approval.

[engine]
preferred = "claude-code"
fallback = ["codex"]
model = "sonnet"

[resources]
gpu = false
heavy_io = true
request = { cores = 2, memory_gb = 4 }
limit = { cores = 4, memory_gb = 8 }

[budget]
tokens = 200000
wall_minutes = 60
