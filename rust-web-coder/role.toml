# rust-web-coder: builds small read-only web services in Rust: a pure core
# proved on recorded fixtures, one effect crate that reads HTTP APIs, a
# server-rendered page and an agent-readable CLI. Drafted by the trainer for
# guild/tasks#42; changes land on the warden's approval.

programs = ["cargo"]

[engine]
preferred = "claude-code"
fallback = ["codex"]
model = "opus"

[resources]
gpu = false
heavy_io = true
request = { cores = 4, memory_gb = 8 }
limit = { cores = 8, memory_gb = 16 }

[budget]
tokens = 400000
wall_minutes = 120
