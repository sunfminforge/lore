# What rust-web-coder must not do. Each says which kind it guards: `money`
# (Felix's), `credentials`, `irreversible`, `data-leaving-host` or
# `product-direction` (the steward's), or `none` (the warden's). The
# trainer's guarded prohibitions are its floor, unchanged (guild ADR 0002).

[[prohibition]]
id = "no-force-push"
guards = "irreversible"
on = "shell"
match = "git push --force*"
reason = "A force push rewrites history others have."

[[prohibition]]
id = "no-repo-delete"
guards = "irreversible"
on = "shell"
match = "* repos delete *"
reason = "A deleted repo cannot be had back."

[[prohibition]]
id = "no-keychain-read"
guards = "credentials"
on = "shell"
match = "security find-*-password*"
reason = "Credentials are the steward's to hand out."

[[prohibition]]
id = "no-checkout"
guards = "money"
on = "fetch"
match = "https://*checkout*"
reason = "Spending money is Felix's alone."

[[prohibition]]
id = "no-paste-out"
guards = "data-leaving-host"
on = "fetch"
match = "https://*paste*"
reason = "Private data stays on Guild's machines."

[[prohibition]]
id = "no-cargo-publish"
guards = "irreversible"
on = "shell"
match = "cargo publish*"
reason = "A crate published to a registry cannot be taken back; pure crates are publish = false, and this role never releases."

[[prohibition]]
id = "no-token-handling"
guards = "credentials"
on = "shell"
match = "guild * token *"
reason = "A service is given its read-only token in its environment at run time; tokens are the steward's to hand out, never this role's to fetch."

[[prohibition]]
id = "no-push-base"
guards = "none"
on = "shell"
match = "git push * HEAD:main*"
reason = "Work reaches the base branch only by a pull request the warden lands."

[[prohibition]]
id = "no-push-main"
guards = "none"
on = "shell"
match = "git push * main*"
reason = "Work reaches the base branch only by a pull request the warden lands."

[[prohibition]]
id = "no-review"
guards = "none"
on = "shell"
match = "guild task review *"
reason = "The warden accepts or sends back work; this role never reviews its own."

[[prohibition]]
id = "no-approve"
guards = "none"
on = "shell"
match = "guild pull approve *"
reason = "Approving a pull request is the warden's; this role hands its work in."

[[prohibition]]
id = "no-land"
guards = "none"
on = "shell"
match = "guild land *"
reason = "Landing is the code's, on the warden's approval; this role never lands."

[[prohibition]]
id = "no-role-draft"
guards = "none"
on = "shell"
match = "guild role *"
reason = "Only the trainer crew drafts, defines or restores roles."

[[prohibition]]
id = "no-goal-lever"
guards = "none"
on = "shell"
match = "guild goal *"
reason = "Goals and their levers are the foreman's; this role asks it with guild task question."

[[prohibition]]
id = "no-hard-stop"
guards = "none"
on = "shell"
match = "guild stop --hard*"
reason = "Hard-stopping an instance is the warden's or a person's."

[[prohibition]]
id = "no-decide"
guards = "product-direction"
on = "shell"
match = "guild task decide *"
reason = "A decision ticket is Felix's to decide; this role asks with guild task ask."

[[prohibition]]
id = "no-print-token"
guards = "credentials"
on = "shell"
match = "printenv *TOKEN*"
reason = "A token is never printed, logged or rendered; check that a variable is set without showing its value."

[[prohibition]]
id = "no-env-file"
guards = "credentials"
on = "write"
match = "*.env"
reason = "A token is taken from the environment at run time, never stored in a file."

[[prohibition]]
id = "no-api-write"
guards = "irreversible"
on = "shell"
match = "curl * -X *"
reason = "The services this role builds only read; it sends no request that could change another system."

[[prohibition]]
id = "no-deploy"
guards = "none"
on = "shell"
match = "launchctl *"
reason = "Deploying a service is not this role's; it runs one only in a test or a local check."

[[prohibition]]
id = "no-release"
guards = "none"
on = "shell"
match = "git tag *"
reason = "Releasing is not this role's; a change ready to ship says so in its pull request."

[[prohibition]]
id = "no-agit-push"
guards = "none"
on = "shell"
match = "git push *refs/for/*"
reason = "A pull request opened by AGit cannot be landed or updated by its branch; open it from a pushed branch."
