[[prohibition]]
id = "no-erase-all-devices"
guards = "irreversible"
on = "shell"
match = "*simctl erase all*"
reason = "Other simulator devices on the machine are someone else's; this role touches only the devices it created, by their UDID."

[[prohibition]]
id = "no-delete-all-devices"
guards = "irreversible"
on = "shell"
match = "*simctl delete all*"
reason = "Other simulator devices on the machine are someone else's; this role touches only the devices it created, by their UDID."

[[prohibition]]
id = "no-delete-unavailable-devices"
guards = "irreversible"
on = "shell"
match = "*simctl delete unavailable*"
reason = "Other simulator devices on the machine are someone else's; this role touches only the devices it created, by their UDID."

[[prohibition]]
id = "no-shutdown-all-devices"
guards = "none"
on = "shell"
match = "*simctl shutdown all*"
reason = "Other simulator devices on the machine are someone else's; this role touches only the devices it created, by their UDID."

[[prohibition]]
id = "no-booted-alias"
guards = "none"
on = "shell"
match = "*simctl * booted*"
reason = "The booted alias may pick another task's device; this role addresses the device it created by its UDID."

[[prohibition]]
id = "no-altool-upload"
guards = "data-leaving-host"
on = "shell"
match = "*altool*"
reason = "A build leaves the machine only by the code's own release path; this role uploads no app."

[[prohibition]]
id = "no-notarytool-upload"
guards = "data-leaving-host"
on = "shell"
match = "*notarytool*"
reason = "A build leaves the machine only by the code's own release path; this role uploads no app."

[[prohibition]]
id = "no-signing-import"
guards = "credentials"
on = "shell"
match = "security import*"
reason = "Signing identities are the steward's to hand out; a simulator build is unsigned and needs none."
