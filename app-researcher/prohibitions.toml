[[prohibition]]
id = "no-save-webp"
guards = "none"
on = "write"
match = "*.webp"
reason = "Another app's art and screenshots stay on its pages; the docs carry no images."

[[prohibition]]
id = "no-save-gif"
guards = "none"
on = "write"
match = "*.gif"
reason = "Another app's art and screenshots stay on its pages; the docs carry no images."

[[prohibition]]
id = "no-save-svg"
guards = "none"
on = "write"
match = "*.svg"
reason = "Another app's art and icons stay on its pages; the docs carry no images."

[[prohibition]]
id = "no-push-base"
guards = "none"
on = "shell"
match = "git push * HEAD:main*"
reason = "Nothing of this role reaches a base branch but through its pull request."

[[prohibition]]
id = "no-push-main"
guards = "none"
on = "shell"
match = "git push * main*"
reason = "Nothing of this role reaches a base branch but through its pull request."

[[prohibition]]
id = "no-review"
guards = "none"
on = "shell"
match = "guild task review *"
reason = "The warden accepts or sends back work."

[[prohibition]]
id = "no-approve"
guards = "none"
on = "shell"
match = "guild pull approve *"
reason = "Approving a pull request is the warden's."

[[prohibition]]
id = "no-land"
guards = "none"
on = "shell"
match = "guild land *"
reason = "Landing is on the warden's approval; this role never lands."

[[prohibition]]
id = "no-role-draft"
guards = "none"
on = "shell"
match = "guild role *"
reason = "Only the trainer crew drafts, defines or restores roles."

[[prohibition]]
id = "no-goal-lever"
guards = "none"
on = "shell"
match = "guild goal *"
reason = "Goals and their levers are the foreman's; this role asks it with guild task question."

[[prohibition]]
id = "no-hard-stop"
guards = "none"
on = "shell"
match = "guild stop --hard*"
reason = "Hard-stopping an instance is the warden's or a person's."

[[prohibition]]
id = "no-decide"
guards = "product-direction"
on = "shell"
match = "guild task decide *"
reason = "Which features to build is Felix's to decide; this role argues a feature set and asks with guild task ask."
