# What app-researcher must not do. Each says which kind it guards: `money`
# (Felix's), `credentials`, `irreversible`, `data-leaving-host` or
# `product-direction` (the steward's), or `none` (the warden's). The
# trainer's guarded prohibitions are its floor, unchanged (guild ADR 0002).

[[prohibition]]
id = "no-force-push"
guards = "irreversible"
on = "shell"
match = "git push --force*"
reason = "A force push rewrites history others have."

[[prohibition]]
id = "no-repo-delete"
guards = "irreversible"
on = "shell"
match = "* repos delete *"
reason = "A deleted repo cannot be had back."

[[prohibition]]
id = "no-keychain-read"
guards = "credentials"
on = "shell"
match = "security find-*-password*"
reason = "Credentials are the steward's to hand out."

[[prohibition]]
id = "no-checkout"
guards = "money"
on = "fetch"
match = "https://*checkout*"
reason = "Spending money is Felix's alone."

[[prohibition]]
id = "no-paste-out"
guards = "data-leaving-host"
on = "fetch"
match = "https://*paste*"
reason = "Private data stays on Guild's machines."

[[prohibition]]
id = "no-gh-file"
guards = "data-leaving-host"
on = "shell"
match = "*gh issue create*"
reason = "What goes to GitHub is filed by the steward's filer alone: a cause in Guild's code with guild ticket file, which labels it for the guild fleet, files it once per cause and follows it; Guild's own issues are read and commented on with guild task and guild goal, never gh."

[[prohibition]]
id = "no-purchase"
guards = "money"
on = "fetch"
match = "https://*purchase*"
reason = "This role buys nothing: no app, subscription, trial or in-app purchase; a paywalled page is named as not read."

[[prohibition]]
id = "no-subscribe"
guards = "money"
on = "fetch"
match = "https://*subscribe*"
reason = "This role starts no subscription or trial; spending money is Felix's alone."

[[prohibition]]
id = "no-signin"
guards = "credentials"
on = "fetch"
match = "https://*signin*"
reason = "This role reads as an anonymous visitor and signs in nowhere; a page behind a sign-in is named as not read."

[[prohibition]]
id = "no-sign-in"
guards = "credentials"
on = "fetch"
match = "https://*sign-in*"
reason = "This role reads as an anonymous visitor and signs in nowhere."

[[prohibition]]
id = "no-login"
guards = "credentials"
on = "fetch"
match = "https://*login*"
reason = "This role reads as an anonymous visitor and signs in nowhere."

[[prohibition]]
id = "no-signup"
guards = "credentials"
on = "fetch"
match = "https://*signup*"
reason = "This role makes no account anywhere."

[[prohibition]]
id = "no-token-handling"
guards = "credentials"
on = "shell"
match = "guild * token *"
reason = "Tokens are the steward's to hand out, never this role's to fetch."

[[prohibition]]
id = "no-env-dump"
guards = "credentials"
on = "shell"
match = "printenv*"
reason = "The environment may carry a credential; dumping it would put a secret into a log."

[[prohibition]]
id = "no-app-store-cli"
guards = "money"
on = "shell"
match = "mas *"
reason = "This role installs and buys no app; the Mac App Store CLI does both."

[[prohibition]]
id = "no-simulator-install"
guards = "none"
on = "shell"
match = "xcrun simctl install*"
reason = "This role installs no app; it reads apps' public pages only."

[[prohibition]]
id = "no-brew-install"
guards = "none"
on = "shell"
match = "brew install*"
reason = "This role installs nothing; it reads the web and writes Markdown."

[[prohibition]]
id = "no-cask-install"
guards = "none"
on = "shell"
match = "brew * --cask*"
reason = "This role installs no app."

[[prohibition]]
id = "no-npm-install"
guards = "none"
on = "shell"
match = "npm install*"
reason = "This role installs nothing; it writes no code."

[[prohibition]]
id = "no-pip-install"
guards = "none"
on = "shell"
match = "pip* install*"
reason = "This role installs nothing; it writes no code."

[[prohibition]]
id = "no-edit-swift"
guards = "none"
on = "write"
match = "*.swift"
reason = "This role writes docs, never code."

[[prohibition]]
id = "no-edit-rust"
guards = "none"
on = "write"
match = "*.rs"
reason = "This role writes docs, never code."

[[prohibition]]
id = "no-edit-kotlin"
