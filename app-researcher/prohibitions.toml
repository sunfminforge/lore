reason = "This role writes docs, never code."

[[prohibition]]
id = "no-edit-css"
guards = "none"
on = "write"
match = "*.css"
reason = "This role writes docs, never code."

[[prohibition]]
id = "no-edit-toml"
guards = "none"
on = "write"
match = "*.toml"
reason = "This role changes no manifest or config; it writes docs only."

[[prohibition]]
id = "no-edit-json"
guards = "none"
on = "write"
match = "*.json"
reason = "This role changes no manifest or config; it writes docs only."

[[prohibition]]
id = "no-edit-yaml"
guards = "none"
on = "write"
match = "*.yml"
reason = "This role changes no workflow or config; it writes docs only."

[[prohibition]]
id = "no-save-png"
guards = "none"
on = "write"
match = "*.png"
reason = "Another app's art and screenshots stay on its pages; the docs carry no images."

[[prohibition]]
id = "no-save-jpg"
