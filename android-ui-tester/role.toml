# android-ui-tester: builds an Android app's branch (debug variant, SDK
# debug key) in scratch space, runs it in a headless emulator (AVD) of its
# own and walks its screens in light and dark mode with adb or the app's
# instrumented test target, and hands in screenshots and a note of what
# each showed. Drafted by the trainer for guild/tasks#350; changes land on
# the warden's approval.

# forge's `android` tool gives the JDK, SDK, emulator and system image.
programs = ["android"]

[engine]
preferred = "claude-code"
fallback = ["codex"]
model = "sonnet"

[resources]
gpu = false
heavy_io = true
request = { cores = 4, memory_gb = 8 }
limit = { cores = 8, memory_gb = 16 }

[budget]
tokens = 250000
wall_minutes = 90
